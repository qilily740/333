<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="frame-src about:">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iris">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<script>document.write('<link rel="manifest" href="'+(location.hostname.toLowerCase().endsWith('.github.io')?'config/manifest.webmanifest':'config/manifest-custom.webmanifest')+'">')</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"></noscript>
<link rel="preload" href="assets/fonts/iris-kai.woff2" as="font" type="font/woff2" crossorigin>
<link rel="apple-touch-icon" sizes="180x180" href="assets/iris-app-icon-180.png">
<title>Iris</title>
<script>(()=>{const v=new URLSearchParams(location.search).get('iris-release');window.IRIS_RELEASE=v;const suffix=v?'?iris-release='+encodeURIComponent(v):'';document.write('<link rel="stylesheet" href="style.css'+suffix+'">')})();</script>
</head>
<body>
<main class="phone">
<header class="topbar"><h1 id="chatTitle" role="button" tabindex="0" aria-label="Open settings">Chat</h1><div class="top-actions"><button class="avatar-stack" id="characters" aria-label="切换角色"></button><button class="icon-button settings-button" id="settings" aria-label="打开设置"></button></div></header>
<section class="conversation" id="conversation" aria-label="聊天记录" aria-live="polite"></section>
<div class="shade" id="shade" hidden></div><section class="sheet" id="sheet" hidden aria-label="功能面板"></section>
<footer class="bottom"><div class="offline-reply-status" id="offlineReplyStatus" role="status" hidden></div><nav class="dock" id="dock" aria-label="Bottom navigation"></nav><form class="composer" id="composer" hidden><div class="composer-tools"><div class="quick-features" id="quickFeatures" hidden><button type="button" class="quick-item" data-quick="语音" aria-label="Voice"><span class="quick-icon" data-icon="mic"></span><span>Voice</span></button><button type="button" class="quick-item" data-quick="视频" aria-label="Video"><span class="quick-icon" data-icon="video"></span><span>Video</span></button><button type="button" class="quick-item" data-quick="图片" aria-label="Image"><span class="quick-icon" data-icon="image"></span><span>Image</span></button><button type="button" class="quick-item" data-quick="转账" aria-label="Transfer"><span class="quick-icon" data-icon="transfer"></span><span>Transfer</span></button><button type="button" class="quick-item" data-quick="定位" aria-label="Location"><span class="quick-icon" data-icon="location"></span><span>Location</span></button><button type="button" class="quick-item" data-quick="听歌" aria-label="Music"><span class="quick-icon" data-icon="music"></span><span>Music</span></button><button type="button" class="quick-item" data-quick="阅读" aria-label="Read"><span class="quick-icon" data-icon="book"></span><span>Read</span></button><button type="button" class="quick-item quick-exit" id="closeInput" aria-label="Exit"><span class="quick-icon" data-icon="arrow"></span><span>Exit</span></button></div><button type="button" class="circle small" id="inputFunctions" aria-label="Show functions" aria-expanded="false" aria-controls="quickFeatures"></button></div><div class="input-wrap"><textarea id="messageInput" class="message-input" rows="1" placeholder="Type a message…" aria-label="Message"></textarea><button type="button" class="emoji" id="emoji" aria-label="Insert emoji"></button></div><button class="circle small" type="button" id="reply" aria-label="请求回复或重新生成" title="请求回复 / 重新生成回复"></button></form><section class="emoji-inline-panel" id="emojiInlinePanel" hidden aria-label="表情包面板"></section></footer>
<div class="toast" id="toast" role="status" hidden></div>
<section class="settings-screen" id="settingsScreen" hidden aria-label="Settings"><header class="settings-topbar"><button type="button" id="closeSettings" aria-label="返回聊天">Settings</button></header><div class="settings-content" id="settingsContent"></div></section>
<section class="feature-screen" id="featureScreen" hidden aria-label="功能页面"><header class="feature-page-topbar"><div id="featurePageTitle"></div></header><div class="feature-page-content" id="featurePageContent"></div></section>
</main><dialog class="profile-dialog" id="profileDialog" tabindex="-1" aria-labelledby="profileTitle"></dialog><dialog class="profile-dialog character-dialog" id="characterDialog" tabindex="-1" aria-labelledby="characterTitle"></dialog><dialog class="api-model-dialog" id="apiModelsDialog" aria-label="选择 API 模型"></dialog><script>const q=window.IRIS_RELEASE?'?iris-release='+encodeURIComponent(window.IRIS_RELEASE):'';const loader=document.createElement('script');loader.src='scripts/storage-bootstrap.js'+q;document.body.append(loader);</script></body></html>
