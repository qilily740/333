<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="frame-src about:">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iris">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<script>document.write('<link rel="manifest" href="'+(location.hostname.toLowerCase().endsWith('.github.io')?'config/manifest.webmanifest':'config/manifest-custom.webmanifest')+'">')</script>
<link rel="stylesheet" href="assets/fonts/fonts.css?v=2">
<link rel="preload" href="assets/fonts/great-vibes/great-vibes-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="apple-touch-icon" sizes="180x180" href="assets/iris-app-icon-180.png">
<title>Iris</title>
<style>
#irisBootScreen{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#fff;color:#222;opacity:1;visibility:visible;transition:opacity .24s ease,visibility .24s ease}
#irisBootScreen[hidden]{display:none}
#irisBootScreen.is-ready{opacity:0;visibility:hidden;pointer-events:none}
.iris-boot-mark{padding:8px 16px;font:400 48px/1.2 "Great Vibes","Snell Roundhand","Apple Chancery",cursive;letter-spacing:0;text-align:center;-webkit-mask-image:linear-gradient(90deg,#000 40%,transparent 60%);mask-image:linear-gradient(90deg,#000 40%,transparent 60%);-webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-position:0% 0;mask-position:0% 0;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;animation:iris-boot-ink 2.1s cubic-bezier(.22,.61,.36,1) infinite}
.iris-boot-rule{width:34px;height:1px;margin:18px auto 0;background:#d8d8d8;transform-origin:left;animation:iris-boot-progress 1.2s ease-in-out infinite alternate}
@keyframes iris-boot-progress{from{transform:scaleX(.25);opacity:.45}to{transform:scaleX(1);opacity:1}}
@keyframes iris-boot-ink{0%,8%{-webkit-mask-position:100% 0;mask-position:100% 0;color:#aaa;opacity:.35}42%,100%{-webkit-mask-position:0% 0;mask-position:0% 0;color:#222;opacity:1}}
@media(prefers-reduced-motion:reduce){#irisBootScreen{transition:none}.iris-boot-mark{animation-duration:2.1s;animation-iteration-count:infinite}.iris-boot-rule{animation:none;transform:scaleX(.6);opacity:.7}}
</style>
<script>(()=>{const v=new URLSearchParams(location.search).get('iris-release');window.IRIS_RELEASE=v;const suffix=v?'?iris-release='+encodeURIComponent(v):'?v=5.6.11';window.IRIS_STYLES_READY=new Promise(resolve=>{const link=document.createElement('link');link.rel='preload';link.as='style';link.href='style.css'+suffix;link.onload=()=>{link.onload=null;link.rel='stylesheet';requestAnimationFrame(()=>resolve())};link.onerror=resolve;document.head.append(link)})})();</script>

</head>
<body>
<div id="irisBootScreen" role="status" aria-label="正在打开 Iris"><div><div class="iris-boot-mark">Iris</div><div class="iris-boot-rule"></div></div></div>
<script>window.IRIS_BOOT_STARTED_AT=performance.now();document.fonts?.load?.('400 48px "Great Vibes"').catch(()=>{});</script>
<main class="phone">
<header class="topbar"><h1 id="chatTitle" role="button" tabindex="0" aria-label="Open settings">Chat</h1><div class="top-actions"><button class="avatar-stack" id="characters" aria-label="切换角色"></button><button class="icon-button settings-button" id="settings" aria-label="打开设置"></button></div></header>
<section class="conversation" id="conversation" aria-label="聊天记录" aria-live="polite"></section>
<div class="shade" id="shade" hidden></div><section class="sheet" id="sheet" hidden aria-label="功能面板"></section>
<footer class="bottom"><div class="offline-reply-status" id="offlineReplyStatus" role="status" hidden></div><nav class="dock" id="dock" aria-label="Bottom navigation"></nav><form class="composer" id="composer" hidden><div class="composer-tools"><div class="quick-features" id="quickFeatures" hidden><button type="button" class="quick-item" data-quick="语音" aria-label="Voice"><span class="quick-icon" data-icon="mic"></span><span>Voice</span></button><button type="button" class="quick-item" data-quick="视频" aria-label="Video"><span class="quick-icon" data-icon="video"></span><span>Video</span></button><button type="button" class="quick-item" data-quick="图片" aria-label="Image"><span class="quick-icon" data-icon="image"></span><span>Image</span></button><button type="button" class="quick-item" data-quick="转账" aria-label="Transfer"><span class="quick-icon" data-icon="transfer"></span><span>Transfer</span></button><button type="button" class="quick-item" data-quick="定位" aria-label="Location"><span class="quick-icon" data-icon="location"></span><span>Location</span></button><button type="button" class="quick-item" data-quick="听歌" aria-label="Music"><span class="quick-icon" data-icon="music"></span><span>Music</span></button><button type="button" class="quick-item" data-quick="阅读" aria-label="Read"><span class="quick-icon" data-icon="book"></span><span>Read</span></button><button type="button" class="quick-item quick-exit" id="closeInput" aria-label="Exit"><span class="quick-icon" data-icon="arrow"></span><span>Exit</span></button></div><button type="button" class="circle small" id="inputFunctions" aria-label="Show functions" aria-expanded="false" aria-controls="quickFeatures"></button></div><div class="input-wrap"><textarea id="messageInput" class="message-input" rows="1" placeholder="Type a message…" aria-label="Message"></textarea><button type="button" class="emoji" id="emoji" aria-label="Insert emoji"></button></div><button class="circle small" type="button" id="reply" aria-label="请求回复或重新生成" title="请求回复 / 重新生成回复"></button></form><section class="emoji-inline-panel" id="emojiInlinePanel" hidden aria-label="表情包面板"></section></footer>
<div class="toast" id="toast" role="status" hidden></div>
<section class="settings-screen" id="settingsScreen" hidden aria-label="Settings"><header class="settings-topbar"><button type="button" id="closeSettings" aria-label="返回聊天">Settings</button></header><div class="settings-content" id="settingsContent"></div></section>
<section class="feature-screen" id="featureScreen" hidden aria-label="功能页面"><header class="feature-page-topbar"><div id="featurePageTitle"></div></header><div class="feature-page-content" id="featurePageContent"></div></section>
</main><dialog class="profile-dialog" id="profileDialog" tabindex="-1" aria-labelledby="profileTitle"></dialog><dialog class="profile-dialog character-dialog" id="characterDialog" tabindex="-1" aria-labelledby="characterTitle"></dialog><dialog class="api-model-dialog" id="apiModelsDialog" aria-label="选择 API 模型"></dialog><dialog class="author-notice-dialog" id="authorNoticeDialog" aria-label="Iris小手机使用须知"></dialog><script>const q=window.IRIS_RELEASE?'?iris-release='+encodeURIComponent(window.IRIS_RELEASE):'?v=5.6.11';const loader=document.createElement('script');loader.src='scripts/storage-bootstrap.js'+q;document.body.append(loader);</script></body></html>
